# 定时真模型 eval（A1 回归门）——DCP-3 ② 的"定时 eval job"。
#
# 为什么单独一个 workflow：真模型 eval 需 API 凭据 + 预算 + 中转站，不进公共 CI（见 ci.yml 注释）。
# 这里用 repo secrets 经【中转站 relay】跑——**不需要直连 sk-ant- key**，relay 凭据即可
# （run-a1.ts 只要求 ANTHROPIC_API_KEY 存在，sk-ant- 仅软警告）。
#
# 触发：每周一次（北京周二凌晨）+ 手动（workflow_dispatch，可限量做廉价冒烟）。
# 判定：run-a1.ts 自带阈值门 + baseline.json 回归对照（任一指标较基线降 >3pp → 非零退出 → 本 job 变红）。
# 失败 → 复用渠道 adapter 推一条告警到 ALERT_WEBHOOK（飞书等）。
#
# ⚠️ 网络前提：GitHub 托管 runner 在境外，必须能访问你的 relay（ANTHROPIC_BASE_URL）。
#    若 relay 限国内 IP/区域 → runner 连不上，eval 会网络失败。两条退路：
#      ① 用 self-hosted runner（跑在你能访问 relay 的机器/VPS 上）；
#      ② 改在容器内跑（加 /api/eval 端点 + 数据集打进镜像）。
#
# 需要在 repo 配置（Settings → Secrets and variables → Actions）：
#   Secrets：ANTHROPIC_API_KEY（relay 凭据）、ANTHROPIC_BASE_URL（relay 端点）、
#            可选 ALERT_WEBHOOK、ALERT_FEISHU_SECRET
#   Variables：ANALYZER_MODEL、VALIDATOR_MODEL、COVERAGE_MODEL（展示反扩写复核）；三者均为
#              relay 支持的不同模型。可选 ALERT_CHANNEL。

name: Scheduled Eval (A1 regression)

on:
  schedule:
    - cron: "0 18 * * 1" # 每周一 UTC 18:00 = 北京周二 02:00
  workflow_dispatch:
    inputs:
      quality_limit:
        description: "限制 quality 主题数（0=全量）；冒烟省成本时设小值"
        default: "0"
      consistency_limit:
        description: "限制一致性对数（0=全量）"
        default: "0"
      source_ids:
        description: "可选：逗号分隔的 staged source id；在隔离 SQLite 中真实采集并要求每个源进入 A1 样本"
        required: false
        type: string
      cohort_min_body:
        description: "source cohort 最小正文字符数（默认 400；须足以供 analyzer 生成可校验引文）"
        default: "400"
        required: false
        type: string

concurrency:
  group: eval-${{ github.ref }}
  cancel-in-progress: false

jobs:
  a1:
    name: A1 真模型回归 eval（经 relay）
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
      ANALYZER_MODEL: ${{ vars.ANALYZER_MODEL }}
      VALIDATOR_MODEL: ${{ vars.VALIDATOR_MODEL }}
      COVERAGE_MODEL: ${{ vars.COVERAGE_MODEL }}
      VALIDATOR_THINKING: "0" # 中转站 thinking+forced tool_choice 组合会 400（见 practice-log）
      PROMPT_CACHE: "0" # 本 relay 只写不读 prompt cache（首跑实测 cache r/w 0/17135）→ 关掉免付写入溢价
      A1_QUALITY_LIMIT: ${{ github.event.inputs.quality_limit || '0' }}
      A1_CONSISTENCY_LIMIT: ${{ github.event.inputs.consistency_limit || '0' }}
    steps:
      - name: 检查 relay 凭据是否已配
        id: guard
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$ANTHROPIC_BASE_URL" ]; then
            echo "::notice::未配置 ANTHROPIC_API_KEY / ANTHROPIC_BASE_URL secrets，跳过真模型 eval（没有 relay 凭据时本 job 空跑、不报错）。"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$ANALYZER_MODEL" ] || [ -z "$VALIDATOR_MODEL" ] || [ -z "$COVERAGE_MODEL" ]; then
            echo "::error::真模型 eval 要求 ANALYZER_MODEL、VALIDATOR_MODEL、COVERAGE_MODEL 三个 Actions Variables；缺失时不能伪装为成功跳过。"
            exit 1
          fi
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v7
      - if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
      - if: steps.guard.outputs.skip != 'true'
        run: npm ci
      - name: 建立隔离 source cohort A1 数据集
        id: cohort
        if: steps.guard.outputs.skip != 'true' && github.event_name == 'workflow_dispatch' && github.event.inputs.source_ids != ''
        env:
          SOURCE_IDS: ${{ github.event.inputs.source_ids }}
          COHORT_MIN_BODY: ${{ github.event.inputs.cohort_min_body || '400' }}
        run: |
          set -euo pipefail
          cohort_dir="$(mktemp -d "$RUNNER_TEMP/a1-source-cohort.XXXXXX")"
          mkdir -p "$cohort_dir/data"
          export EVAL_ISOLATED_ROOT="$cohort_dir"
          export DB_PATH="$cohort_dir/insight.db"
          export DATA_DIR="$cohort_dir/data"
          export EVAL_SOURCE_IDS="$SOURCE_IDS"
          export EVAL_COHORT_COLLECTION_MANIFEST="$cohort_dir/collection.json"
          npm run eval:collect-source-cohort

          export EVAL_REQUIRED_SOURCE_IDS="$SOURCE_IDS"
          export EVAL_MIN_BODY="$COHORT_MIN_BODY"
          export EVAL_LOCAL_OUT="$cohort_dir/insight-quality.jsonl"
          export EVAL_SOURCE_COHORT_MANIFEST="$cohort_dir/dataset.json"
          npm run eval:build-local
          test -s "$EVAL_LOCAL_OUT"
          echo "A1_QUALITY_FILE=$EVAL_LOCAL_OUT" >> "$GITHUB_ENV"
          echo "mode=source-cohort" >> "$GITHUB_OUTPUT"
          echo "Source cohort data set: $EVAL_LOCAL_OUT"
      - name: 跑 A1 eval（阈值门 + baseline 回归对照）
        if: steps.guard.outputs.skip != 'true'
        run: npm run eval:a1
      - name: 保存 A1 逐样本证据
        if: always() && steps.guard.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: a1-evidence-${{ github.run_id }}
          path: |
            evals/out/
            # cohort_dir 由 mktemp 创建为 a1-source-cohort.XXXXXX；只保留可审计的
            # collection/dataset manifest，不上传隔离 SQLite 或抓取到的原文正文。
            ${{ runner.temp }}/a1-source-cohort.*/collection.json
            ${{ runner.temp }}/a1-source-cohort.*/dataset.json
          if-no-files-found: warn
          retention-days: 90
      - name: 回归/失败 → 推告警（复用渠道 adapter）
        if: failure()
        env:
          ALERT_WEBHOOK: ${{ secrets.ALERT_WEBHOOK }}
          ALERT_CHANNEL: ${{ vars.ALERT_CHANNEL }}
          ALERT_FEISHU_SECRET: ${{ secrets.ALERT_FEISHU_SECRET }}
          NOTIFY_TITLE: "🔴 A1 定时 eval 回归/失败"
          NOTIFY_TEXT: "${{ github.repository }} 的定时 A1 eval 未过阈值或较 baseline 回归 >3pp。"
          NOTIFY_LINK: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          if [ -z "$ALERT_WEBHOOK" ]; then
            echo "未配 ALERT_WEBHOOK secret，跳过告警推送（job 仍标红，看 GitHub 通知即可）。"
            exit 0
          fi
          node ops/probe-alert.mjs
