name: Publish Production Image

# 只有 main 的 CI 成功后才构建生产镜像，避免把未通过质量门的提交送入可部署仓库。
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: publish-production-image-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  admission:
    name: verify trusted CI publication evidence
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.admission.outputs.publish }}
    steps:
      - name: Check out the CI-verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Fetch live source run and attempt jobs
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('node:fs');
            const source = context.payload.workflow_run;
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: source.id });
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt, {
              ...context.repo, run_id: source.id, attempt_number: source.run_attempt, per_page: 100
            });
            const { assertTrustedRun } = await import(`${process.env.GITHUB_WORKSPACE}/ops/ci-publish-admission.mjs`);
            assertTrustedRun(run, source, process.env.GITHUB_REPOSITORY);
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/publication-source.json`, JSON.stringify({ run, event: source, repository: process.env.GITHUB_REPOSITORY, jobs }));
      - name: Download exact scope evidence
        uses: actions/download-artifact@v8
        with:
          name: ci-change-scope-${{ github.event.workflow_run.head_sha }}-${{ github.event.workflow_run.run_attempt }}
          path: ${{ runner.temp }}/publication/scope
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Read scope mode
        id: scope
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const s=JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (!["docs","full"].includes(s.mode)) throw new Error("invalid scope"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `mode=${s.mode}\n`);' "$RUNNER_TEMP/publication/scope/ci-change-scope.json"
      - name: Download full application evidence
        if: steps.scope.outputs.mode == 'full'
        uses: actions/download-artifact@v8
        with:
          name: prototype-ci-evidence-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/publication/ci
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Download full Docker evidence
        if: steps.scope.outputs.mode == 'full'
        uses: actions/download-artifact@v8
        with:
          name: prototype-docker-evidence-${{ github.event.workflow_run.head_sha }}
          path: ${{ runner.temp }}/publication/docker
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Verify scope identity and every required result
        id: admission
        run: node ops/ci-publish-admission.mjs "$RUNNER_TEMP/publication" "$RUNNER_TEMP/publication-source.json"

  publish:
    name: build linux/amd64 and publish to GHCR
    needs: admission
    if: needs.admission.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the CI-verified commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture immutable release timestamp
        id: release
        run: echo "released_at=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      - name: Build and push immutable production image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository }}:sha-${{ github.event.workflow_run.head_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.workflow_run.head_sha }}
          build-args: |
            TARGETARCH=amd64
            GIT_SHA=${{ github.event.workflow_run.head_sha }}
            RELEASED_AT=${{ steps.release.outputs.released_at }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      # 包可见性是一次性 owner-level 配置：GITHUB_TOKEN 可推镜像，但不是个人包管理 API 的 owner。
      # setup-github-oidc.sh 的 SET_GITHUB_PACKAGE_PUBLIC=1 会在 operator 授权后完成这一步。
