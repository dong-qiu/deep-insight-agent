name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

# 同分支新推送取消旧跑，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # eval 门禁兜底：改了 AI 质量面(agents/sources/llm.ts/dataset)的提交必须带 Eval-Gate 盖章
  # （= 已在本地跑过 /eval-gate 对比基线）。与 .githooks/pre-push 同款判定脚本；这里绕不过
  # （--no-verify / EVAL_GATE_ACK 只绕本地 hook，不影响 CI）。PR 与直推 main 都查。对 squash
  # 合并后的 push，GitHub API 将新提交关联回已验证 PR，再检查原 PR 区间；直接推送仍严格查 before..after。
  # 本 job 不跑真模型 eval（要 key/预算，见 verify job 注释与 eval.yml）——只校验盖章存在。
  eval-gate:
    name: eval-gate (trailer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: require Eval-Gate stamp on AI-quality changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$EVENT" != "pull_request" ] && printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$'; then
            echo "首次/新分支 push（before 全 0），无前序区间，跳过 eval-gate。"; exit 0
          fi

          resolution="$RUNNER_TEMP/eval-gate-range.json"
          node ops/eval-gate-range.mjs > "$resolution"
          base="$(node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); process.stdout.write(r.baseSha)' "$resolution")"
          head="$(node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); process.stdout.write(r.headSha)' "$resolution")"
          pull_number="$(node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); process.stdout.write(r.pullNumber ? String(r.pullNumber) : "")' "$resolution")"
          source="$(node -e 'const r = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); process.stdout.write(r.source)' "$resolution")"
          if [ -n "$pull_number" ]; then
            git fetch --no-tags origin "+refs/pull/$pull_number/head:refs/remotes/eval-gate/pr-$pull_number"
            head="refs/remotes/eval-gate/pr-$pull_number"
          fi
          range="$base..$head"
          echo "eval-gate source: $source"
          echo "eval-gate range: $range"
          bash .githooks/eval-gate-check.sh "$range"

  # PR 证据门（校准期）：命中 AI 高风险路径时，要求 PR 给出 Pre-PR AI Review 摘要，
  # 并附 eval 指标/产物或有 trailer 支撑的例外说明。初期尚未加入 main 的必需检查，
  # 以便观察误报；稳定后再更新 branch protection。判定逻辑在 ops/pr-policy.mjs，
  # 不跑模型，也不代替 eval-gate。
  pr-policy:
    name: pr-policy (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: require review and eval evidence for AI-risk PRs
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          body_file="$RUNNER_TEMP/pr-body.md"
          printf '%s' "$PR_BODY" > "$body_file"
          node ops/pr-policy.mjs --base "$PR_BASE" --head "$PR_HEAD" --pr-body-file "$body_file"

  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24.19.0"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Vitest 覆盖确定性 eval 逻辑（reachability/verdict/选片/分批/repairQuote 等，无需 key），
      # 并执行全局覆盖率下限，防止关键逻辑的测试保护静默回退。
      # 真模型 eval（npm run eval:a1）+ 回归门需 API 凭据 + 预算 + 中转站 → 不在公共 CI 跑，
      # 改由定时 workflow `.github/workflows/eval.yml`（每周 + 手动，用 relay secrets）运行；
      # 见 docs/plan/m3-plan.md M3-4、docs/launch/operations.md §13。
      - run: npm run test:coverage
      - name: next build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # 供应链：整个 lockfile 的 high/critical 漏洞均阻断。开发/构建依赖同样会在 CI 与
      # 开发者机器执行，不能仅因不随生产镜像 ship 就忽略；Dependabot 负责提出升级，本门兜底。
      - name: npm audit (all deps, high+ blocking)
        run: npm audit --audit-level=high

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: deep-insight:ci
          build-args: |
            TARGETARCH=amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: verify dispatch worker runtime assets
        run: |
          docker run --rm --entrypoint node deep-insight:ci --check /app/ops/generation-dispatch-worker.mjs
          docker run --rm --entrypoint node deep-insight:ci --check /app/ops/generation-dispatch-healthcheck.mjs
      - name: e2e dispatch worker readiness
        run: |
          network="dispatch-health-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume="dispatch-health-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          app="dispatch-health-app-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$app" >/dev/null 2>&1 || true
            docker volume rm -f "$volume" >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$network" >/dev/null
          docker volume create "$volume" >/dev/null
          docker run --rm --user 0 -v "$volume":/data deep-insight:ci sh -c 'chown -R app:app /data'
          docker run --rm -v "$volume":/data deep-insight:ci node /app/ops/run-provenance-migrations.mjs
          docker run -d --name "$app" --network "$network" \
            -e AUTH_SECRET=ci-auth-secret -e ADMIN_EMAIL=ci@example.test -e ADMIN_PASSWORD=ci-password \
            -e CRON_SECRET=ci-cron-secret -e DISPATCH_WORKER_SECRET=ci-dispatch-secret \
            -e PROVENANCE_SCHEMA_REQUIRED=1 -v "$volume":/data deep-insight:ci >/dev/null
          ready=0
          for _ in $(seq 1 30); do
            if docker run --rm --network "$network" --entrypoint node deep-insight:ci -e "fetch('http://$app:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "application never became ready" >&2
            docker logs "$app" >&2 || true
            exit 1
          fi
          if ! docker run --rm --network "$network" -e APP_URL="http://$app:3000" -e DISPATCH_WORKER_SECRET=ci-dispatch-secret \
            --entrypoint node deep-insight:ci /app/ops/generation-dispatch-healthcheck.mjs; then
            echo "ready application failed dispatch-worker probe" >&2
            docker logs "$app" >&2 || true
            exit 1
          fi
          docker run --rm -v "$volume":/data --entrypoint node deep-insight:ci --input-type=module -e '
            import Database from "better-sqlite3";
            const db = new Database("/data/insight.db"); db.pragma("foreign_keys=ON");
            const at = "2020-01-01T00:00:00.000Z";
            db.prepare("INSERT INTO generation_trace(id,request_id,scope_kind,trigger_kind,topic_id,root_run_id,status,completion_policy,coverage,runtime_version,summary,next_sequence,started_at,ended_at,retry_of_trace_id) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)").run("trace_e2e", null, "topic_pipeline", "api", null, null, "running", "{}", "complete", "{}", "{}", 0, at, null, null);
            db.prepare("INSERT INTO generation_trace_request(id,scope_key,active_key,idempotency_key_hash,request_sequence,trace_id,state,retained_until,created_at) VALUES (?,?,?,?,?,?,?,?,?)").run("request_e2e", "e2e", "e2e", null, 1, "trace_e2e", "accepted", "2027-01-01T00:00:00.000Z", at);
            db.prepare("INSERT INTO generation_lease(id,active_key,scope_key,trace_id,state,owner_token,fencing_epoch,heartbeat_at,expires_at,created_at,released_at) VALUES (?,?,?,?,?,?,?,?,?,?,?)").run("lease_e2e", "e2e", "e2e", "trace_e2e", "reserved", null, 0, null, null, at, null);
            db.prepare("INSERT INTO generation_dispatch(id,request_id,trace_id,kind,payload,state,attempt,claim_epoch,owner_token,claimed_at,heartbeat_at,lease_expires_at,last_error,created_at,updated_at) VALUES (?,?,?,?,?,?,?,?,?,?,?,?,?,?,?)").run("dispatch_e2e", "request_e2e", "trace_e2e", "topic_pipeline", "{}", "queued", 0, 0, null, null, null, null, null, at, at);
            db.close();
          '
          if docker run --rm --network "$network" -e APP_URL="http://$app:3000" -e DISPATCH_WORKER_SECRET=ci-dispatch-secret \
            --entrypoint node deep-insight:ci /app/ops/generation-dispatch-healthcheck.mjs; then
            echo "stalled durable dispatch incorrectly passed worker readiness" >&2
            exit 1
          fi
