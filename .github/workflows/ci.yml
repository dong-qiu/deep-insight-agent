name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 同分支新推送取消旧跑，省额度
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # eval 门禁兜底：改了 AI 质量面(agents/sources/llm.ts/dataset)的提交必须带 Eval-Gate 盖章
  # （= 已在本地跑过 /eval-gate 对比基线）。与 .githooks/pre-push 同款判定脚本；这里绕不过
  # （--no-verify / EVAL_GATE_ACK 只绕本地 hook，不影响 CI）。PR 与直推 main 都查——直推 main
  # 用 before..after，作为分支保护之外的防御纵深。
  # 本 job 不跑真模型 eval（要 key/预算，见 verify job 注释与 eval.yml）——只校验盖章存在。
  eval-gate:
    name: eval-gate (trailer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: require Eval-Gate stamp on AI-quality changes
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif printf '%s' "$PUSH_BEFORE" | grep -qE '^0+$'; then
            echo "首次/新分支 push（before 全 0），无前序区间，跳过 eval-gate。"; exit 0
          else
            range="$PUSH_BEFORE..$PUSH_AFTER"
          fi
          echo "eval-gate range: $range"
          bash .githooks/eval-gate-check.sh "$range"

  # PR 证据门（校准期）：命中 AI 高风险路径时，要求 PR 给出 Pre-PR AI Review 摘要，
  # 并附 eval 指标/产物或有 trailer 支撑的例外说明。初期尚未加入 main 的必需检查，
  # 以便观察误报；稳定后再更新 branch protection。判定逻辑在 ops/pr-policy.mjs，
  # 不跑模型，也不代替 eval-gate。
  pr-policy:
    name: pr-policy (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: require review and eval evidence for AI-risk PRs
        env:
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          body_file="$RUNNER_TEMP/pr-body.md"
          printf '%s' "$PR_BODY" > "$body_file"
          node ops/pr-policy.mjs --base "$PR_BASE" --head "$PR_HEAD" --pr-body-file "$body_file"

  verify:
    name: typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20.18.1"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # Vitest 覆盖确定性 eval 逻辑（reachability/verdict/选片/分批/repairQuote 等，无需 key），
      # 并执行全局覆盖率下限，防止关键逻辑的测试保护静默回退。
      # 真模型 eval（npm run eval:a1）+ 回归门需 API 凭据 + 预算 + 中转站 → 不在公共 CI 跑，
      # 改由定时 workflow `.github/workflows/eval.yml`（每周 + 手动，用 relay secrets）运行；
      # 见 docs/plan/m3-plan.md M3-4、docs/launch/operations.md §13。
      - run: npm run test:coverage
      - name: next build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      # 供应链：生产依赖 high/critical 漏洞**阻断**门（与 architecture.md「CI npm audit」自述对齐）。
      # 只卡 --omit=dev：dev/构建链漏洞（esbuild/vite/vitest 等）不随生产镜像 ship、噪声大，
      # 不阻断 PR；真正进生产运行时的依赖出 high+ 才挡。Dependabot 负责升级、本门兜底。
      - name: npm audit (prod deps, high+ blocking)
        run: npm audit --omit=dev --audit-level=high

  docker:
    name: docker build
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: deep-insight:ci
          build-args: |
            TARGETARCH=amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
