name: Deploy Production Image

# Identity preflight only. Production switching remains blocked until a separately
# reviewed safe rollback, data and all-writer maintenance protocol is implemented.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Explicit identity-reviewed sha-<40 hex>; no main/latest default"
        required: true
        type: string
      approved_index_digest:
        description: "Approved OCI index sha256 digest"
        required: true
        type: string
      approved_manifest_digest:
        description: "Approved linux/amd64 manifest sha256 digest"
        required: true
        type: string
      approved_config_digest:
        description: "Approved linux/amd64 config sha256 digest (not Docker ID)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    name: identity preflight (production switching blocked)
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.19.0'
      - name: Verify approved objects and actual pulled image on isolated runner
        id: identity
        env:
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
          APPROVED_INDEX_DIGEST: ${{ inputs.approved_index_digest }}
          APPROVED_MANIFEST_DIGEST: ${{ inputs.approved_manifest_digest }}
          APPROVED_CONFIG_DIGEST: ${{ inputs.approved_config_digest }}
        run: node ops/aws/security-release-gate.mjs "$RUNNER_TEMP/release-identity.json"
      - name: Block production switching until all remaining prerequisites are reviewed
        id: hold
        if: always()
        run: |
          echo "Production deployment blocked: safe rollback, data compatibility, all-writer drain, maintenance exclusion, unknown SSM state and named authorization remain unresolved." >&2
          exit 1
